plugins {
	id 'fabric-loom' version '1.18.2'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"nedra" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Клиентские игровые тесты со скриншотами (./gradlew runClientGameTest -PnedraClientTest).
// Подключаются только по флагу, чтобы обычная сборка мода от них не зависела.
if (project.hasProperty("nedraClientTest")) {
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "nedra-gametest"
			enableGameTests = false
			enableClientGameTests = true
			eula = true
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
