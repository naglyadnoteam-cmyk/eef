name: Probe Prostor APIs

# Справка для разработки: точные имена классов и методов Майнкрафта (декомпилированные исходники)
# и ванильные json/текстуры как образцы. Запускается при изменении этого файла.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/stoic-bell-nkwv8g
    paths:
      - '.github/workflows/probe-prostor.yml'

jobs:
  vanilla-data:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download vanilla 1.21.11 server and client jars
        run: |
          set -e
          mkdir -p /tmp/vanilla && cd /tmp/vanilla
          VERSION_URL=$(curl -sSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id=="1.21.11") | .url')
          curl -sSL "$VERSION_URL" -o version.json
          curl -sSL -o server.jar "$(jq -r '.downloads.server.url' version.json)"
          curl -sSL -o client.jar "$(jq -r '.downloads.client.url' version.json)"
          java -DbundlerMainClass=net.minecraft.data.Main -jar server.jar --all --output /tmp/vanilla/datagen > /dev/null 2>&1
          mkdir -p client && cd client && unzip -oq ../client.jar 'assets/*' && cd ..
          ls datagen

      - name: Vanilla data dump
        working-directory: /tmp/vanilla/datagen
        run: |
          set +e
          W=data/minecraft/worldgen
          for b in forest birch_forest taiga old_growth_birch_forest meadow river; do
            echo "######## biome/$b.json"; jq -c . "$W/biome/$b.json"
          done
          echo "######## placed features (all names)"; ls $W/placed_feature | sed 's/.json$//' | tr '\n' ' '; echo
          echo "######## configured features (all names)"; ls $W/configured_feature | sed 's/.json$//' | tr '\n' ' '; echo
          for f in fallen_birch_tree fallen_spruce_tree forest_rock trees_birch_and_oak_leaf_litter patch_firefly_bush_near_water patch_sugar_cane flower_forest_flowers patch_grass_forest patch_large_fern trees_taiga patch_waterlily disk_clay disk_sand disk_gravel wildflowers_birch_forest patch_leaf_litter patch_bush; do
            echo "######## placed_feature/$f.json"; [ -f "$W/placed_feature/$f.json" ] && jq -c . "$W/placed_feature/$f.json"
            echo "######## configured_feature/$f.json"; [ -f "$W/configured_feature/$f.json" ] && jq -c . "$W/configured_feature/$f.json" | cut -c1-1500
          done
          echo "######## music / ambient sound events"
          jq -r '."minecraft:sound_event".entries | keys[]' reports/registries.json | grep -E "music\.|ambient\." | tr '\n' ' '; echo
          echo "######## particle types"
          jq -r '."minecraft:particle_type".entries | keys[]' reports/registries.json | tr '\n' ' '; echo
          echo "######## blocks containing bush|leaf_litter|firefly|reed|cattail|lily|fern|moss|clay"
          jq -r '."minecraft:block".entries | keys[]' reports/registries.json | grep -E "bush|litter|firefly|lily|fern|moss|wildflower|grass" | tr '\n' ' '; echo

      - name: Vanilla textures as samples (base64)
        working-directory: /tmp/vanilla/client/assets/minecraft/textures
        run: |
          for t in block/grass_block_top block/short_grass block/fern block/lily_pad block/sugar_cane block/birch_leaves; do
            echo "######## $t.png"; base64 -w0 "$t.png"; echo
          done

  sources:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prostor-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache decompiled sources
        uses: actions/cache@v4
        with:
          path: prostor-mod/.gradle/loom-cache
          key: prostor-decompile-1.21.11-build6-v1

      - name: Gen sources
        run: |
          chmod +x gradlew
          ./gradlew genSources --no-daemon --quiet

      - name: Unpack sources
        run: |
          COMMON=$(realpath "$(find .gradle/loom-cache/minecraftMaven -ipath "*minecraft-common-*" -iname "*-sources.jar" | head -1)")
          CLIENT=$(realpath "$(find .gradle/loom-cache/minecraftMaven -ipath "*minecraft-clientOnly-*" -iname "*-sources.jar" | head -1)")
          mkdir -p /tmp/src && cd /tmp/src
          unzip -oq "$COMMON"
          unzip -oq "$CLIENT"
          find /tmp/src -name "*.java" | wc -l

      - name: Java API probe
        working-directory: /tmp/src
        run: |
          set +e
          sec() { echo ""; echo "######## $1"; }
          g() { f=$(find /tmp/src -path "*$1" | head -1); echo "--- $f :: $2"; [ -n "$f" ] && grep -n -E "$2" "$f" | head -${3:-25}; }
          full() { f=$(find /tmp/src -path "*$1" | head -1); echo "--- FULL $f"; [ -n "$f" ] && sed -n "${3:-1},${2:-200}p" "$f"; }
          ctx() { f=$(find /tmp/src -path "*$1" | head -1); echo "--- CTX $f :: $2"; [ -n "$f" ] && grep -n -A ${3:-8} -E "$2" "$f" | head -${4:-60}; }
          sec VANILLA_BIOME_PARAMETERS; full net/minecraft/world/biome/source/util/VanillaBiomeParameters.java 700
          sec PRESET; g net/minecraft/world/biome/source/MultiNoiseBiomeSourceParameterList.java "Preset|OVERWORLD|writeOverworldBiomeParameters|getEntries|public" 30
          sec PARAMRANGE; g net/minecraft/world/biome/source/util/MultiNoiseUtil.java "record ParameterRange|public static ParameterRange|public long |public float |min\\(\\)|max\\(\\)|toFloat|toLong|record NoiseHypercube|record NoiseValuePoint|public static NoiseValuePoint" 40
          sec LOCATE; g net/minecraft/server/world/ServerWorld.java "locateBiome" 6
          ctx net/minecraft/server/command/LocateCommand.java "executeLocateBiome" 25 40
          sec FEATURE; g net/minecraft/world/gen/feature/Feature.java "public static final Feature<|public abstract boolean generate|protected void setBlockState" 30
          g net/minecraft/world/gen/feature/util/FeatureContext.java "public" 20
          sec STRUCTUREACCESS; g net/minecraft/world/StructureWorldAccess.java "public|default|boolean|Server" 20
          g net/minecraft/world/ChunkRegion.java "public ServerWorld toServerWorld|getSeed|public boolean setBlockState|isValidForSetBlock" 10
          sec NOISE; g net/minecraft/util/math/noise/SimplexNoiseSampler.java "public" 10
          g net/minecraft/util/math/noise/OctavePerlinNoiseSampler.java "public static|public double sample" 10
          g net/minecraft/util/math/random/ChunkRandom.java "public" 20
          sec HEIGHT; g net/minecraft/world/gen/chunk/ChunkGenerator.java "public abstract int getHeight|public int getHeightOnGround|getSeaLevel|getMinimumY" 10
          sec STRUCTURES_AT; g net/minecraft/world/gen/StructureAccessor.java "public" 25
          sec COMMANDS; g net/minecraft/server/command/TeleportCommand.java "requires|hasPermissionLevel|PermissionLevel" 6
          g net/minecraft/server/command/ServerCommandSource.java "public boolean hasPermissionLevel|public .*getPlayerOrThrow|public void sendFeedback|public void sendError|public ServerWorld getWorld|public Vec3d getPosition" 12
          sec TELEPORT; g net/minecraft/server/network/ServerPlayerEntity.java "public boolean teleport|public void teleport|teleportTo" 10
          sec BIOMEKEYS; g net/minecraft/world/biome/BiomeKeys.java "FOREST|BIRCH|TAIGA" 10
          sec CONFIG; g net/fabricmc/loader/api/FabricLoader.java "getConfigDir" 3
