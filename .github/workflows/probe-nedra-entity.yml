name: Probe Nedra Entity APIs

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/minecraft-speedrunner-hunter-mod-q48dt3
    paths:
      - '.github/workflows/probe-nedra-entity.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nedra-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache decompiled sources
        uses: actions/cache@v4
        with:
          path: nedra-mod/.gradle/loom-cache
          key: nedra-decompile-1.21.11-build6-v1

      - name: Gen sources
        run: ./gradlew genSources --no-daemon --quiet

      - name: Unpack sources
        run: |
          set +e
          COMMON=$(realpath "$(find .gradle/loom-cache/minecraftMaven -ipath "*minecraft-common-*" -iname "*-sources.jar" | head -1)")
          CLIENT=$(realpath "$(find .gradle/loom-cache/minecraftMaven -ipath "*minecraft-clientOnly-*" -iname "*-sources.jar" | head -1)")
          mkdir -p /tmp/src
          cd /tmp/src
          unzip -oq "$COMMON"
          unzip -oq "$CLIENT"
          find /tmp/src -name "*.java" | wc -l

      - name: Java API probe
        working-directory: /tmp/src
        run: |
          set +e
          sec() { echo ""; echo "######## $1"; }
          g() { f=$(find /tmp/src -path "*$1" | head -1); echo "--- $f :: $2"; [ -n "$f" ] && grep -n -E "$2" "$f" | head -${3:-25}; }
          full() { f=$(find /tmp/src -path "*$1" | head -1); echo "--- FULL $f"; [ -n "$f" ] && sed -n "1,${2:-200}p" "$f"; }
          ctx() { f=$(find /tmp/src -path "*$1" | head -1); echo "--- CTX $f :: $2"; [ -n "$f" ] && grep -n -A ${3:-8} -E "$2" "$f" | head -${4:-60}; }
          sec TOOLMAT; full net/minecraft/item/ToolMaterial.java 120
          sec ITEMSETTINGS; g net/minecraft/item/Item.java "public Item.Settings (pickaxe|axe|shovel|hoe|sword|tool|armor|spear|weapon)|public Settings (pickaxe|axe|shovel|hoe|sword|tool|armor|spear|weapon)|public void postHit|public boolean postHit|postDamageEntity|public boolean postMine" 30
          ctx net/minecraft/item/Item.java "public Item.Settings sword|public Settings sword" 12 30
          ctx net/minecraft/item/Item.java "public Item.Settings pickaxe|public Settings pickaxe" 6 20
          g net/minecraft/item/AxeItem.java "public AxeItem" 5
          g net/minecraft/item/ShovelItem.java "public ShovelItem" 5
          g net/minecraft/item/HoeItem.java "public HoeItem" 5
          ls /tmp/src/net/minecraft/item/ | grep -i -E "sword|tool|mining" 
          sec ARMORMATS; full net/minecraft/item/equipment/ArmorMaterials.java 80 | grep -n -E "IRON|DIAMOND|NETHERITE|new ArmorMaterial|Map.of" 
          sec DROPS; g net/minecraft/block/Block.java "public static List<ItemStack> getDroppedStacks|public static void dropStacks" 10
          sec RECIPE; g net/minecraft/recipe/ServerRecipeManager.java "public .*getFirstMatch|public .*Optional" 12
          g net/minecraft/recipe/SingleStackRecipe.java "public|result" 20
          g net/minecraft/recipe/input/SingleStackRecipeInput.java "record|public" 8
          sec POWDER; ctx net/minecraft/block/PowderSnowBlock.java "canWalkOnPowderSnow" 6 12
          sec GOLEM; g net/minecraft/entity/passive/IronGolemEntity.java "public IronGolemEntity|protected void initGoals|public boolean tryAttack|createIronGolemAttributes|public void handleStatus|public boolean canTarget|isPlayerCreated|public int getAttackTicksLeft|attackTicksLeft =|protected void mobTick|public void tickMovement" 30
          ctx net/minecraft/entity/passive/IronGolemEntity.java "public boolean tryAttack" 25 30
          full net/minecraft/client/render/entity/IronGolemEntityRenderer.java 60
          full net/minecraft/client/render/entity/state/IronGolemEntityRenderState.java 30
          sec BOSSBAR; g net/minecraft/entity/boss/ServerBossBar.java "public ServerBossBar|public void (addPlayer|removePlayer|setPercent)" 8
          g net/minecraft/entity/boss/WitherEntity.java "bossBar|onStartedTrackingBy|onStoppedTrackingBy" 12
          sec BLOCKUSE; g net/minecraft/block/AbstractBlock.java "protected ActionResult onUseWithItem|protected ActionResult onUse" 4
          sec MOBXP; g net/minecraft/entity/mob/MobEntity.java "experiencePoints" 5
          sec LIVING; g net/minecraft/entity/LivingEntity.java "public boolean isInvulnerableTo|public boolean damage\\(|protected void applyDamage|public boolean canHaveStatusEffect|public final boolean isFallFlying|public boolean handleFallDamage" 10
          g net/minecraft/entity/Entity.java "public boolean isInvulnerableTo|public boolean handleFallDamage|public boolean isFireImmune" 6
          sec SPAWNEGG; ls /tmp/src/net/minecraft/item/ | grep -i egg
          sec DONE; echo DONE

      - name: Fabric javap
        run: |
          set +e
          jp() { jar=$(find /home/runner/.gradle/caches/modules-2 -ipath "*$1*" -iname "*.jar" | grep -v sources | head -1); echo "--- javap $2 from $jar"; javap -p -classpath "$jar" "$2" 2>&1 | head -60; }
          lst() { for jar in $(find /home/runner/.gradle/caches/modules-2 -iname "fabric-*.jar" | grep -v sources); do unzip -l "$jar" | grep -E "$1" | awk -v j="$jar" '{print $NF " <- " j}'; done | head -20; }
          lst "RenderLayerMap"
          jp fabric-rendering-v1 net.fabricmc.fabric.api.client.rendering.v1.BlockRenderLayerMap
          jp fabric-blockrenderlayer-v1 net.fabricmc.fabric.api.blockrenderlayer.v1.BlockRenderLayerMap
          echo DONE
      - name: Vanilla references
        run: |
          set +e
          mkdir -p /tmp/vanilla && cd /tmp/vanilla
          MANIFEST=$(curl -sSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
          VERSION_URL=$(echo "$MANIFEST" | python3 -c "import json,sys; d=json.load(sys.stdin); print([v['url'] for v in d['versions'] if v['id']=='1.21.11'][0])")
          VERSION_JSON=$(curl -sSL "$VERSION_URL")
          SERVER_URL=$(echo "$VERSION_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['downloads']['server']['url'])")
          CLIENT_URL=$(echo "$VERSION_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['downloads']['client']['url'])")
          curl -sSL -o server.jar "$SERVER_URL"
          curl -sSL -o client.jar "$CLIENT_URL"
          java -DbundlerMainClass=net.minecraft.data.Main -jar server.jar --server --output /tmp/vanilla/datagen > /dev/null 2>&1
          D=/tmp/vanilla/datagen/data/minecraft
          mkdir -p cl && cd cl && unzip -oq ../client.jar 'assets/*' && cd ..
          A=/tmp/vanilla/cl/assets/minecraft
          echo "######## EQUIPMENT JSON"; cat $A/equipment/iron.json; cat $A/equipment/leather.json
          ls $A/textures/entity/iron_golem
          for t in textures/entity/iron_golem/iron_golem.png textures/entity/equipment/humanoid/iron.png textures/entity/equipment/humanoid_leggings/iron.png \
                   textures/entity/equipment/humanoid/netherite.png textures/entity/equipment/humanoid_leggings/netherite.png \
                   textures/item/iron_pickaxe.png textures/item/iron_axe.png textures/item/iron_shovel.png textures/item/iron_sword.png textures/item/iron_hoe.png \
                   textures/item/iron_chestplate.png textures/item/iron_leggings.png textures/item/iron_boots.png textures/item/leather_boots.png \
                   textures/item/echo_shard.png textures/item/trial_key.png textures/item/heart_of_the_sea.png textures/item/recovery_compass_16.png \
                   textures/item/iron_golem_spawn_egg.png textures/item/zombie_spawn_egg.png textures/block/chiseled_deepslate.png textures/block/reinforced_deepslate_top.png textures/block/reinforced_deepslate_side.png \
                   textures/entity/zombie/zombie.png; do
            echo ""; echo "B64 $t $(base64 -w0 "$A/$t" 2>/dev/null)"
          done
          echo ""
          echo DONE
          exit 0
          mkdir -p cl && cd cl && unzip -oq ../client.jar 'assets/*' && cd ..
          A=/tmp/vanilla/cl/assets/minecraft
          for f in blockstates/amethyst_cluster.json models/block/amethyst_cluster.json models/item/amethyst_cluster.json items/amethyst_cluster.json models/block/cube_column.json; do
            echo ""; echo "######## ASSET $f"; cat "$A/$f" 2>&1 | head -80
          done
          ls $A/textures/entity/breeze
          for t in textures/entity/breeze/breeze.png textures/entity/breeze/breeze_wind.png textures/entity/breeze/breeze_eyes.png textures/item/breeze_spawn_egg.png \
                   textures/block/amethyst_cluster.png textures/block/quartz_bricks.png textures/block/calcite.png textures/block/amethyst_block.png textures/block/redstone_block.png textures/block/crimson_nylium.png; do
            echo ""; echo "B64 $t $(base64 -w0 "$A/$t" 2>/dev/null)"
          done
          echo ""
          echo DONE
