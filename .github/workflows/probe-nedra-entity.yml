name: Probe Nedra Entity APIs

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/minecraft-speedrunner-hunter-mod-q48dt3
    paths:
      - '.github/workflows/probe-nedra-entity.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nedra-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache decompiled sources
        uses: actions/cache@v4
        with:
          path: nedra-mod/.gradle/loom-cache
          key: nedra-decompile-1.21.11-build6-v1

      - name: Gen sources
        run: ./gradlew genSources --no-daemon --quiet

      - name: Unpack sources
        run: |
          set +e
          COMMON=$(realpath "$(find .gradle/loom-cache/minecraftMaven -ipath "*minecraft-common-*" -iname "*-sources.jar" | head -1)")
          CLIENT=$(realpath "$(find .gradle/loom-cache/minecraftMaven -ipath "*minecraft-clientOnly-*" -iname "*-sources.jar" | head -1)")
          mkdir -p /tmp/src
          cd /tmp/src
          unzip -oq "$COMMON"
          unzip -oq "$CLIENT"
          find /tmp/src -name "*.java" | wc -l

      - name: Java API probe
        working-directory: /tmp/src
        run: |
          set +e
          sec() { echo ""; echo "######## $1"; }
          g() { f=$(find /tmp/src -path "*$1" | head -1); echo "--- $f :: $2"; [ -n "$f" ] && grep -n -E "$2" "$f" | head -${3:-25}; }
          full() { f=$(find /tmp/src -path "*$1" | head -1); echo "--- FULL $f"; [ -n "$f" ] && sed -n "1,${2:-200}p" "$f"; }
          ctx() { f=$(find /tmp/src -path "*$1" | head -1); echo "--- CTX $f :: $2"; [ -n "$f" ] && grep -n -A ${3:-8} -E "$2" "$f" | head -${4:-60}; }
          sec WINDCHARGE; full net/minecraft/entity/projectile/BreezeWindChargeEntity.java 80
          full net/minecraft/entity/projectile/AbstractWindChargeEntity.java 200 | grep -n -E "EXPLOSION_BEHAVIOR|createExplosion|AdvancedExplosionBehavior|class |protected|public" 
          ctx net/minecraft/entity/projectile/AbstractWindChargeEntity.java "EXPLOSION_BEHAVIOR =" 6 10
          full net/minecraft/world/explosion/AdvancedExplosionBehavior.java 80 | grep -n -E "public|knockback|Optional"
          sec SPAWNERLOGIC; ctx net/minecraft/block/spawner/MobSpawnerLogic.java "public void serverTick" 70 80
          full net/minecraft/block/spawner/MobSpawnerEntry.java 60 | grep -n -E "record|public|entity"
          g net/minecraft/nbt/NbtCompound.java "public (Optional<String>|String) getString" 4
          sec DONE; echo DONE

      - name: Fabric javap
        run: |
          set +e
          jp() { jar=$(find /home/runner/.gradle/caches/modules-2 -ipath "*$1*" -iname "*.jar" | grep -v sources | head -1); echo "--- javap $2 from $jar"; javap -p -classpath "$jar" "$2" 2>&1 | head -60; }
          lst() { for jar in $(find /home/runner/.gradle/caches/modules-2 -iname "fabric-*.jar" | grep -v sources); do unzip -l "$jar" | grep -E "$1" | awk -v j="$jar" '{print $NF " <- " j}'; done | head -20; }
          lst "RenderLayerMap"
          jp fabric-rendering-v1 net.fabricmc.fabric.api.client.rendering.v1.BlockRenderLayerMap
          jp fabric-blockrenderlayer-v1 net.fabricmc.fabric.api.blockrenderlayer.v1.BlockRenderLayerMap
          echo DONE
      - name: Vanilla references
        run: |
          set +e
          mkdir -p /tmp/vanilla && cd /tmp/vanilla
          MANIFEST=$(curl -sSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
          VERSION_URL=$(echo "$MANIFEST" | python3 -c "import json,sys; d=json.load(sys.stdin); print([v['url'] for v in d['versions'] if v['id']=='1.21.11'][0])")
          VERSION_JSON=$(curl -sSL "$VERSION_URL")
          SERVER_URL=$(echo "$VERSION_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['downloads']['server']['url'])")
          CLIENT_URL=$(echo "$VERSION_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['downloads']['client']['url'])")
          curl -sSL -o server.jar "$SERVER_URL"
          curl -sSL -o client.jar "$CLIENT_URL"
          java -DbundlerMainClass=net.minecraft.data.Main -jar server.jar --server --output /tmp/vanilla/datagen > /dev/null 2>&1
          D=/tmp/vanilla/datagen/data/minecraft
          for f in worldgen/structure_set/mineshafts.json worldgen/structure/mineshaft.json loot_table/entities/breeze.json loot_table/chests/trial_chambers/reward.json \
                   tags/block/crystal_sound_blocks.json tags/entity_type/fall_damage_immune.json; do
            echo ""; echo "######## DATA $f"; cat "$D/$f" 2>&1 | head -150
          done
          mkdir -p cl && cd cl && unzip -oq ../client.jar 'assets/*' && cd ..
          A=/tmp/vanilla/cl/assets/minecraft
          for f in blockstates/amethyst_cluster.json models/block/amethyst_cluster.json models/item/amethyst_cluster.json items/amethyst_cluster.json models/block/cube_column.json; do
            echo ""; echo "######## ASSET $f"; cat "$A/$f" 2>&1 | head -80
          done
          ls $A/textures/entity/breeze
          for t in textures/entity/breeze/breeze.png textures/entity/breeze/breeze_wind.png textures/entity/breeze/breeze_eyes.png textures/item/breeze_spawn_egg.png \
                   textures/block/amethyst_cluster.png textures/block/quartz_bricks.png textures/block/calcite.png textures/block/amethyst_block.png textures/block/redstone_block.png textures/block/crimson_nylium.png; do
            echo ""; echo "B64 $t $(base64 -w0 "$A/$t" 2>/dev/null)"
          done
          echo ""
          echo DONE
