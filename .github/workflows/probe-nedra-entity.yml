name: Probe Nedra Entity APIs

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/minecraft-speedrunner-hunter-mod-q48dt3
    paths:
      - '.github/workflows/probe-nedra-entity.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nedra-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache decompiled sources
        uses: actions/cache@v4
        with:
          path: nedra-mod/.gradle/loom-cache
          key: nedra-decompile-1.21.11-build6-v1

      - name: Gen sources
        run: ./gradlew genSources --no-daemon --quiet

      - name: Unpack sources
        run: |
          set +e
          COMMON=$(realpath "$(find .gradle/loom-cache/minecraftMaven -ipath "*minecraft-common-*" -iname "*-sources.jar" | head -1)")
          CLIENT=$(realpath "$(find .gradle/loom-cache/minecraftMaven -ipath "*minecraft-clientOnly-*" -iname "*-sources.jar" | head -1)")
          mkdir -p /tmp/src
          cd /tmp/src
          unzip -oq "$COMMON"
          unzip -oq "$CLIENT"
          find /tmp/src -name "*.java" | wc -l

      - name: Java API probe
        working-directory: /tmp/src
        run: |
          set +e
          sec() { echo ""; echo "######## $1"; }
          g() { f=$(find /tmp/src -path "*$1" | head -1); echo "--- $f :: $2"; [ -n "$f" ] && grep -n -E "$2" "$f" | head -${3:-25}; }
          full() { f=$(find /tmp/src -path "*$1" | head -1); echo "--- FULL $f"; [ -n "$f" ] && sed -n "1,${2:-200}p" "$f"; }
          ctx() { f=$(find /tmp/src -path "*$1" | head -1); echo "--- CTX $f :: $2"; [ -n "$f" ] && grep -n -A ${3:-8} -E "$2" "$f" | head -${4:-60}; }
          sec PLANT; full net/minecraft/block/PlantBlock.java 80
          full net/minecraft/block/ShortPlantBlock.java 80
          full net/minecraft/block/HangingRootsBlock.java 120
          full net/minecraft/block/MushroomPlantBlock.java 50 | grep -n -E "class|public|protected|MapCodec"
          sec ABSTRACT_BLOCK; g net/minecraft/block/AbstractBlock.java "protected (BlockState|boolean|VoxelShape|void|MapCodec|FluidState) (getStateForNeighborUpdate|canPlaceAt|getOutlineShape|getCollisionShape|randomDisplayTick|getFluidState|getCodec|onEntityCollision|scheduledTick)\(" 20
          ctx net/minecraft/block/AbstractBlock.java "protected BlockState getStateForNeighborUpdate\(" 12 16
          g net/minecraft/block/AbstractBlock.java "public AbstractBlock.Settings (noCollision|breakInstantly|replaceable|offset|pistonBehavior|nonOpaque|ticksRandomly|dynamicBounds|burnable|solid|notSolid|velocityMultiplier|jumpVelocityMultiplier)\(" 20
          g net/minecraft/block/Block.java "public BlockState getPlacementState|protected void appendProperties|createCodec|protected static <B extends Block> RecordCodecBuilder" 10
          sec BLOCKS; ctx net/minecraft/block/Blocks.java "HANGING_ROOTS = register" 14 16
          ctx net/minecraft/block/Blocks.java "public static final Block FERN = register" 10 12
          ctx net/minecraft/block/Blocks.java "public static final Block MOSS_CARPET = register" 6 8
          ctx net/minecraft/block/Blocks.java "public static final Block BROWN_MUSHROOM = register" 12 14
          sec RENDER_LAYERS; grep -rn "HANGING_ROOTS" /tmp/src/net/minecraft/client --include=*.java | head -5
          f=$(grep -rl "Blocks.HANGING_ROOTS" /tmp/src/net/minecraft/client | head -1); echo "LAYER FILE $f"; [ -n "$f" ] && grep -n -E "public static|private static final|BLOCKS.put\(Blocks.HANGING_ROOTS|class " "$f" | head -20
          sec SKELETON_RENDER; full net/minecraft/client/render/entity/BoggedEntityRenderer.java 80
          full net/minecraft/client/render/entity/SkeletonEntityRenderer.java 60
          full net/minecraft/client/render/entity/AbstractSkeletonEntityRenderer.java 80
          full net/minecraft/client/render/entity/state/SkeletonEntityRenderState.java 40
          sec CREEPER_RENDER; full net/minecraft/client/render/entity/CreeperEntityRenderer.java 80
          full net/minecraft/client/render/entity/state/CreeperEntityRenderState.java 30
          sec ENTITIES; full net/minecraft/entity/mob/BoggedEntity.java 200
          g net/minecraft/entity/mob/SkeletonEntity.java "^\s*(public|protected|private)[^=]*\(" 40
          g net/minecraft/entity/mob/AbstractSkeletonEntity.java "^\s*(public|protected|private)[^=]*\(" 60
          g net/minecraft/entity/mob/CreeperEntity.java "^\s*(public|protected|private)[^=]*\(" 60
          ctx net/minecraft/entity/mob/CreeperEntity.java "private void explode\(" 20 24
          sec ETYPE; ctx net/minecraft/entity/EntityType.java "public static final EntityType<BoggedEntity> BOGGED" 9 10
          ctx net/minecraft/entity/EntityType.java "public static final EntityType<CreeperEntity> CREEPER" 9 10
          ctx net/minecraft/entity/EntityType.java "public static final EntityType<SkeletonEntity> SKELETON" 9 10
          g net/minecraft/entity/SpawnRestriction.java "SKELETON|CREEPER|BOGGED|ZOMBIE," 8
          g net/minecraft/entity/attribute/DefaultAttributeRegistry.java "BOGGED|CREEPER|SKELETON," 6
          g net/minecraft/entity/mob/AbstractSkeletonEntity.java "createAbstractSkeletonAttributes|public static" 4
          g net/minecraft/entity/mob/CreeperEntity.java "createCreeperAttributes|public static" 4
          sec DONE; echo DONE

      - name: Fabric javap
        run: |
          set +e
          jp() { jar=$(find /home/runner/.gradle/caches/modules-2 -ipath "*$1*" -iname "*.jar" | grep -v sources | head -1); echo "--- javap $2 from $jar"; javap -p -classpath "$jar" "$2" 2>&1 | head -60; }
          lst() { for jar in $(find /home/runner/.gradle/caches/modules-2 -iname "fabric-*.jar" | grep -v sources); do unzip -l "$jar" | grep -E "$1" | awk -v j="$jar" '{print $NF " <- " j}'; done | head -20; }
          lst "RenderLayerMap"
          jp fabric-rendering-v1 net.fabricmc.fabric.api.client.rendering.v1.BlockRenderLayerMap
          jp fabric-blockrenderlayer-v1 net.fabricmc.fabric.api.blockrenderlayer.v1.BlockRenderLayerMap
          echo DONE
      - name: Vanilla references
        run: |
          set +e
          mkdir -p /tmp/vanilla && cd /tmp/vanilla
          MANIFEST=$(curl -sSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
          VERSION_URL=$(echo "$MANIFEST" | python3 -c "import json,sys; d=json.load(sys.stdin); print([v['url'] for v in d['versions'] if v['id']=='1.21.11'][0])")
          VERSION_JSON=$(curl -sSL "$VERSION_URL")
          SERVER_URL=$(echo "$VERSION_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['downloads']['server']['url'])")
          CLIENT_URL=$(echo "$VERSION_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['downloads']['client']['url'])")
          curl -sSL -o server.jar "$SERVER_URL"
          curl -sSL -o client.jar "$CLIENT_URL"
          java -DbundlerMainClass=net.minecraft.data.Main -jar server.jar --server --output /tmp/vanilla/datagen > /dev/null 2>&1
          D=/tmp/vanilla/datagen/data/minecraft
          for f in worldgen/biome/lush_caves.json worldgen/biome/mangrove_swamp.json loot_table/entities/skeleton.json loot_table/entities/creeper.json loot_table/entities/bogged.json \
                   tags/block/climbable.json tags/entity_type/skeletons.json tags/block/big_dripleaf_placeable.json tags/block/mineable/hoe.json tags/block/sword_efficient.json \
                   tags/block/replaceable_by_trees.json tags/block/dirt.json tags/block/moss_replaceable.json tags/block/replaceable.json loot_table/blocks/hanging_roots.json loot_table/blocks/fern.json; do
            echo ""; echo "######## DATA $f"; cat "$D/$f" 2>&1 | head -120
          done
          mkdir -p cl && cd cl && unzip -oq ../client.jar 'assets/*' && cd ..
          A=/tmp/vanilla/cl/assets/minecraft
          for f in blockstates/hanging_roots.json models/block/hanging_roots.json blockstates/brown_mushroom.json models/block/brown_mushroom.json models/block/cross.json models/block/tinted_cross.json items/hanging_roots.json items/brown_mushroom.json items/fern.json blockstates/cave_vines.json models/block/cave_vines_lit.json items/skeleton_spawn_egg.json; do
            echo ""; echo "######## ASSET $f"; cat "$A/$f" 2>&1 | head -60
          done
          for t in textures/entity/skeleton/skeleton.png textures/entity/skeleton/bogged.png textures/entity/creeper/creeper.png textures/entity/zombie/zombie.png textures/block/hanging_roots.png textures/block/cave_vines.png textures/block/cave_vines_plant.png textures/block/cave_vines_lit.png textures/block/fern.png textures/block/moss_block.png textures/block/mud.png textures/block/brown_mushroom.png textures/block/jungle_leaves.png textures/block/vine.png textures/item/creeper_spawn_egg.png textures/item/skeleton_spawn_egg.png; do
            echo "B64 $t $(base64 -w0 "$A/$t")"
          done
          echo DONE
