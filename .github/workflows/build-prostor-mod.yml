name: Build Prostor Mod

on:
  push:
    branches:
      - claude/stoic-bell-nkwv8g
    paths:
      - 'prostor-mod/**'
      - '.github/workflows/build-prostor-mod.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prostor-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci-marker')"
    defaults:
      run:
        working-directory: prostor-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: prostor-mod-jar
          path: prostor-mod/build/libs/*.jar
          if-no-files-found: error

      - name: Commit built jar back to the repo
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -1)
          mkdir -p dist
          cp "$JAR" dist/prostor-mod.jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/prostor-mod.jar
          if git diff --cached --quiet; then
            echo "Jar unchanged, nothing to commit."
          else
            git commit -m "Update built Prostor jar (skip-ci-marker)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
