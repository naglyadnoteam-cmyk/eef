name: Build Fate Cards Mod

on:
  push:
    branches:
      - claude/minecraft-speedrunner-hunter-mod-q48dt3
    paths:
      - 'fatecards-mod/**'
      - '.github/workflows/build-fatecards-mod.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci-marker')"
    defaults:
      run:
        working-directory: fatecards-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: fatecards-mod-jar
          path: fatecards-mod/build/libs/*.jar
          if-no-files-found: error

      - name: Commit built jar back to the repo
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -1)
          mkdir -p dist
          cp "$JAR" dist/fatecards-mod.jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/fatecards-mod.jar
          if git diff --cached --quiet; then
            echo "Jar unchanged, nothing to commit."
          else
            git commit -m "Update built Fate Cards jar (skip-ci-marker)"
            git push
          fi
