name: Probe ChunkRange API

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chunkrange-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: List gen sources tasks
        run: ./gradlew tasks --all --no-daemon | grep -i sources || true

      - name: Gen sources
        run: ./gradlew genSources --no-daemon --stacktrace || ./gradlew genSourcesWithVineflower --no-daemon --stacktrace || true

      - name: Find and print GameOptions.java
        run: |
          set +e
          echo "===== all *sources* under fabric-loom cache ====="
          find ~/.gradle/caches/fabric-loom -iname "*sources*" 2>/dev/null | head -50
          FILE=$(find ~/.gradle/caches/fabric-loom -iname "GameOptions.java" 2>/dev/null | head -1)
          echo "FILE=$FILE"
          if [ -n "$FILE" ]; then
            echo "===== GameOptions.java (grep viewDistance/simulationDistance context) ====="
            grep -n "viewDistance\|simulationDistance\|SimpleOption.ofInt\|renderDistance" "$FILE"
          else
            echo "not found as loose file, searching inside any sources jars"
            for JAR in $(find ~/.gradle/caches/fabric-loom -iname "*sources*.jar" 2>/dev/null); do
              echo "checking $JAR"
              unzip -l "$JAR" 2>/dev/null | grep -i "GameOptions.java" && FOUND_JAR="$JAR"
            done
            if [ -n "$FOUND_JAR" ]; then
              mkdir -p /tmp/src
              cd /tmp/src
              unzip -oq "$FOUND_JAR" "net/minecraft/client/option/GameOptions.java"
              echo "===== GameOptions.java from jar ====="
              grep -n "viewDistance\|simulationDistance\|SimpleOption.ofInt\|renderDistance" net/minecraft/client/option/GameOptions.java
            fi
          fi
          echo "DONE"
