name: Probe ChunkRange API

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chunkrange-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache decompiled sources
        uses: actions/cache@v4
        with:
          path: chunkrange-mod/.gradle/loom-cache
          key: chunkrange-decompile-1.21.11-build6-v1

      - name: List gen sources tasks
        run: ./gradlew tasks --all --no-daemon | grep -i sources || true

      - name: Gen sources
        run: ./gradlew genSources --no-daemon --stacktrace || ./gradlew genSourcesWithVineflower --no-daemon --stacktrace || true

      - name: Find and print GameOptions.java
        run: |
          set +e
          echo "===== whole-home search for GameOptions.java ====="
          FILE=$(find ~ -iname "GameOptions.java" 2>/dev/null | head -1)
          echo "FILE=$FILE"
          if [ -n "$FILE" ]; then
            echo "===== GameOptions.java (grep viewDistance/simulationDistance context) ====="
            grep -n "viewDistance\|simulationDistance\|SimpleOption.ofInt\|renderDistance" "$FILE"
            exit 0
          fi
          echo "not found as loose file; whole-home search for *sources*.jar"
          find ~ -iname "*sources*.jar" 2>/dev/null > /tmp/jars.txt
          wc -l /tmp/jars.txt
          head -30 /tmp/jars.txt
          for JAR in $(cat /tmp/jars.txt); do
            if unzip -l "$JAR" 2>/dev/null | grep -qi "GameOptions.java"; then
              echo "FOUND in $JAR"
              mkdir -p /tmp/src
              cd /tmp/src
              unzip -oq "$JAR" "net/minecraft/client/option/GameOptions.java"
              echo "===== full constructor slice lines 1470-1520 ====="
              sed -n '1470,1520p' net/minecraft/client/option/GameOptions.java
              echo "===== class-level SliderCallbacks / IntSliderCallbacks defs ====="
              grep -n "class.*Callbacks\|interface.*Callbacks\|IntSliderCallbacks\|ValidatingIntSliderCallbacks" net/minecraft/client/option/GameOptions.java
              echo "===== getViewDistance / getClampedViewDistance context lines 1975-1995 ====="
              sed -n '1975,1995p' net/minecraft/client/option/GameOptions.java
              break
            fi
          done
          echo "DONE"
