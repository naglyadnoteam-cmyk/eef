name: Probe Nedra Worldgen Data

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download vanilla 1.21.11 server jar
        run: |
          set -e
          mkdir -p /tmp/vanilla
          cd /tmp/vanilla
          MANIFEST=$(curl -sSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
          VERSION_URL=$(echo "$MANIFEST" | python3 -c "import json,sys; d=json.load(sys.stdin); print([v['url'] for v in d['versions'] if v['id']=='1.21.11'][0])")
          echo "VERSION_URL=$VERSION_URL"
          VERSION_JSON=$(curl -sSL "$VERSION_URL")
          SERVER_URL=$(echo "$VERSION_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['downloads']['server']['url'])")
          echo "SERVER_URL=$SERVER_URL"
          curl -sSL -o server.jar "$SERVER_URL"
          ls -la

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run vanilla data generator to dump real registry JSONs
        run: |
          set +e
          cd /tmp/vanilla
          java -DbundlerMainClass=net.minecraft.data.Main -jar server.jar --all --output /tmp/vanilla/datagen 2>&1 | tail -60
          echo "===== find dimension_type/noise_settings in datagen output ====="
          find /tmp/vanilla/datagen -iname "overworld.json" -path "*dimension_type*"
          find /tmp/vanilla/datagen -iname "overworld.json" -path "*noise_settings*"
          find /tmp/vanilla/datagen -iname "overworld_caves.json"
          NOISE=$(find /tmp/vanilla/datagen -iname "overworld.json" -path "*noise_settings*" | head -1)
          echo "NOISE=$NOISE"
          wc -l "$NOISE"
          echo "===== noise_settings/overworld.json top-level keys ====="
          NOISE="$NOISE" python3 -c "import json,os; d=json.load(open(os.environ['NOISE'])); print(list(d.keys())); print('sea_level=',d.get('sea_level')); print('disable_mob_generation=',d.get('disable_mob_generation')); print('aquifers_enabled=',d.get('aquifers_enabled')); print('ore_veins_enabled=',d.get('ore_veins_enabled')); print('legacy_random_source=',d.get('legacy_random_source')); print('default_block=',d.get('default_block')); print('default_fluid=',d.get('default_fluid')); n=d.get('noise',{}); print('noise section:', json.dumps(n, indent=2)); print('noise_router top-level keys:', list(d.get('noise_router', {}).keys()))"
          echo "DONE"
