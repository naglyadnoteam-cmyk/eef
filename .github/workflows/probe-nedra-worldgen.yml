name: Probe Nedra Worldgen Data

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download vanilla 1.21.11 server jar
        run: |
          set -e
          mkdir -p /tmp/vanilla
          cd /tmp/vanilla
          MANIFEST=$(curl -sSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
          VERSION_URL=$(echo "$MANIFEST" | python3 -c "import json,sys; d=json.load(sys.stdin); print([v['url'] for v in d['versions'] if v['id']=='1.21.11'][0])")
          echo "VERSION_URL=$VERSION_URL"
          VERSION_JSON=$(curl -sSL "$VERSION_URL")
          SERVER_URL=$(echo "$VERSION_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['downloads']['server']['url'])")
          echo "SERVER_URL=$SERVER_URL"
          curl -sSL -o server.jar "$SERVER_URL"
          ls -la

      - name: Extract vanilla dimension_type and noise_settings jsons
        run: |
          set +e
          cd /tmp/vanilla
          echo "===== searching jar listing for overworld/dimension_type/noise_settings ====="
          unzip -l server.jar | grep -iE "dimension_type|noise_settings/overworld" | head -40
          echo "===== also check for a separate data/server bundle inside the jar ====="
          unzip -l server.jar | grep -iE "\.zip$|data\.zip|server_data"
          echo "DONE"
