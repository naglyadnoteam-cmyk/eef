name: Probe Fate Cards API

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fatecards-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Attempt build (expected to fail at compile)
        run: ./gradlew build --no-daemon || true

      - name: javap key classes
        run: |
          set +e
          COMMON=$(find ~/.gradle/caches/fabric-loom/minecraftMaven -ipath "*minecraft-common/*" -iname "minecraft-common-*.jar" | grep -v sources | grep -v intermediary | head -1)
          echo "COMMON=$COMMON"

          mkdir -p /tmp/classes
          cd /tmp/classes

          echo "===== full listing search for ItemEntity ====="
          unzip -l "$COMMON" | grep -i "itementity"

          unzip -oq "$COMMON" "net/minecraft/entity/Entity.class" "net/minecraft/server/network/ServerPlayerEntity.class"

          echo "===== Entity: getpos / getPos (loose) ====="
          javap -p net/minecraft/entity/Entity.class 2>/dev/null | grep -i "getpos"
          echo "===== Entity: ALL Vec3d-returning no-arg methods ====="
          javap -p net/minecraft/entity/Entity.class 2>/dev/null | grep -i "Vec3d get"

          echo "===== ServerPlayerEntity: playsound (loose) ====="
          javap -p net/minecraft/server/network/ServerPlayerEntity.class 2>/dev/null | grep -i "sound"
          echo "===== ServerPlayerEntity: getpos (loose) ====="
          javap -p net/minecraft/server/network/ServerPlayerEntity.class 2>/dev/null | grep -i "getpos"

          ITEMENTITY_PATH=$(unzip -l "$COMMON" | grep -i "itementity.class" | awk '{print $NF}' | head -1)
          echo "ITEMENTITY_PATH=[$ITEMENTITY_PATH]"
          if [ -n "$ITEMENTITY_PATH" ]; then
            unzip -oq "$COMMON" "$ITEMENTITY_PATH"
            CLASSFILE=$(find . -iname "ItemEntity.class")
            echo "CLASSFILE=$CLASSFILE"
            echo "===== ItemEntity: getpos (loose) ====="
            javap -p "$CLASSFILE" 2>/dev/null | grep -i "getpos"
          fi
          echo "DONE"
