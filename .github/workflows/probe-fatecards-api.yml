name: Probe Fate Cards API

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fatecards-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Attempt build (expected to fail at compile)
        run: ./gradlew build --no-daemon || true

      - name: javap key classes
        run: |
          set +e
          MC_DIR=~/.gradle/caches/fabric-loom/1.21.11
          COMMON="$MC_DIR/minecraft-common.jar"
          SERVER="$MC_DIR/minecraft-extracted_server.jar"
          CLIENT="$MC_DIR/minecraft-client.jar"
          AUTHLIB=$(find ~/.gradle/caches/modules-2 -ipath "*authlib*" -iname "*.jar" | grep -v sources | head -1)
          echo "COMMON=$COMMON SERVER=$SERVER CLIENT=$CLIENT AUTHLIB=$AUTHLIB"

          mkdir -p /tmp/classes
          cd /tmp/classes

          find_and_extract() {
            local classpath="$1"
            for jar in "$COMMON" "$SERVER" "$CLIENT"; do
              if unzip -l "$jar" 2>/dev/null | grep -q "$classpath\$"; then
                unzip -oq "$jar" "$classpath"
                echo "  (found in $jar)"
                return 0
              fi
            done
            echo "  (NOT FOUND in common/server/client)"
            return 1
          }

          echo "===== Locating classes ====="
          find_and_extract "net/minecraft/server/network/ServerPlayerEntity.class"
          find_and_extract "net/minecraft/entity/player/PlayerInventory.class"
          find_and_extract "net/minecraft/entity/EntityType.class"
          find_and_extract "net/minecraft/entity/attribute/EntityAttributes.class"
          find_and_extract "net/minecraft/entity/LivingEntity.class"
          find_and_extract "net/minecraft/entity/Entity.class"
          echo "searching for ItemEntity in any of the three jars..."
          for jar in "$COMMON" "$SERVER" "$CLIENT"; do
            unzip -l "$jar" 2>/dev/null | grep -i "ItemEntity.class"
          done
          find_and_extract "net/minecraft/entity/ItemEntity.class" || find_and_extract "net/minecraft/entity/item/ItemEntity.class"
          if [ -n "$AUTHLIB" ]; then
            unzip -oq "$AUTHLIB" "com/mojang/authlib/GameProfile.class" 2>/dev/null
          fi

          echo "===== ServerPlayerEntity: teleport/world/pos/velocity/sound ====="
          javap -p net/minecraft/server/network/ServerPlayerEntity.class 2>/dev/null | grep -iE "teleport|world|pos\(|velocity|playsound"

          echo "===== Entity: teleport/world/pos/velocity ====="
          javap -p net/minecraft/entity/Entity.class 2>/dev/null | grep -iE "teleport|getworld|entityworld|pos\(|velocity"

          echo "===== LivingEntity: teleport ====="
          javap -p net/minecraft/entity/LivingEntity.class 2>/dev/null | grep -iE "teleport"

          echo "===== ItemEntity: pos/world ====="
          javap -p net/minecraft/entity/ItemEntity.class 2>/dev/null | grep -iE "pos\(|getworld|entityworld"
          javap -p net/minecraft/entity/item/ItemEntity.class 2>/dev/null | grep -iE "pos\(|getworld|entityworld"

          echo "===== PlayerInventory: main/getMain/size ====="
          javap -p net/minecraft/entity/player/PlayerInventory.class 2>/dev/null | grep -iE "main|getmain|size\(|getstack|setstack"

          echo "===== EntityType: create( ====="
          javap -p net/minecraft/entity/EntityType.class 2>/dev/null | grep -i "create("

          echo "===== EntityAttributes: GENERIC/SCALE/MAX_HEALTH ====="
          javap -p net/minecraft/entity/attribute/EntityAttributes.class 2>/dev/null | grep -iE "GENERIC|SCALE|MAX_HEALTH|public static"

          echo "===== GameProfile: name/id ====="
          javap -p com/mojang/authlib/GameProfile.class 2>/dev/null | grep -iE "name|id\("
          echo "DONE"
