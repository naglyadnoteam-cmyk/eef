name: Probe Fate Cards API

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fatecards-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Attempt build (expected to fail at compile)
        run: ./gradlew build --no-daemon || true

      - name: javap key classes
        run: |
          set +e
          COMMON=$(find ~/.gradle/caches/fabric-loom/minecraftMaven -ipath "*minecraft-common/*" -iname "minecraft-common-*.jar" | grep -v sources | grep -v intermediary | head -1)
          echo "COMMON=$COMMON"

          mkdir -p /tmp/classes
          cd /tmp/classes
          unzip -oq "$COMMON" "net/minecraft/entity/player/PlayerEntity.class" "net/minecraft/entity/Entity.class" "net/minecraft/server/network/ServerPlayerEntity.class" "net/minecraft/server/network/ServerPlayNetworking.class" "net/minecraft/server/world/ServerWorld.class"

          echo "===== PlayerEntity: sound methods ====="
          javap -p net/minecraft/entity/player/PlayerEntity.class 2>/dev/null | grep -i "sound"

          echo "===== Entity: sound methods ====="
          javap -p net/minecraft/entity/Entity.class 2>/dev/null | grep -i "sound"

          echo "===== ServerWorld: playSound methods ====="
          javap -p net/minecraft/server/world/ServerWorld.class 2>/dev/null | grep -i "playsound"

          echo "DONE"
