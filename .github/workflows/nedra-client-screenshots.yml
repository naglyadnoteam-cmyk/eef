name: Nedra Client Screenshots

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nedra-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          chmod +x gradlew

      - name: Run client gametest (real game client under xvfb)
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1600x900x24" ./gradlew runClientGameTest -PnedraClientTest --no-daemon --stacktrace 2>&1 | tee /tmp/gametest.log

      - name: Client gametest API reference (for debugging compile errors)
        if: always()
        run: |
          set +e
          JAR=$(find ~/.gradle/caches -iname "fabric-client-gametest-api-v1-*.jar" | grep -v sources | head -1)
          echo "jar: $JAR"
          for c in FabricClientGameTest context.ClientGameTestContext context.TestSingleplayerContext context.TestServerContext context.TestClientWorldContext world.TestWorldBuilder; do
            javap -classpath "$JAR" "net.fabricmc.fabric.api.client.gametest.v1.$c" 2>&1 | head -40
          done

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p docs/screenshots
          find . -path ./docs -prune -o -name "nedra_*.png" -print
          find . -path ./docs -prune -o -name "nedra_*.png" -exec cp {} docs/screenshots/ \;
          ls -la docs/screenshots
          LOG=$(find build -path "*clientGameTest*" -name "latest.log" | head -1)
          echo "client log: $LOG"
          [ -n "$LOG" ] && grep -iE "error|exception|warn.*nedra|nedra.*warn|missing|failed" "$LOG" | grep -v "Realms\|realms" | head -80

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nedra-screenshots
          path: |
            nedra-mod/docs/screenshots/*.png
            nedra-mod/build/run/**/logs/latest.log
          if-no-files-found: warn

      - name: Commit screenshots back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Update Nedra in-game screenshots (skip-ci-marker)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
