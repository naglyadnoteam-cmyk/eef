name: Generate Nedra Height Override Data

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download vanilla 1.21.11 server jar
        run: |
          set -e
          mkdir -p /tmp/vanilla
          cd /tmp/vanilla
          MANIFEST=$(curl -sSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
          VERSION_URL=$(echo "$MANIFEST" | python3 -c "import json,sys; d=json.load(sys.stdin); print([v['url'] for v in d['versions'] if v['id']=='1.21.11'][0])")
          VERSION_JSON=$(curl -sSL "$VERSION_URL")
          SERVER_URL=$(echo "$VERSION_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['downloads']['server']['url'])")
          curl -sSL -o server.jar "$SERVER_URL"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run vanilla data generator
        run: |
          set -e
          cd /tmp/vanilla
          java -DbundlerMainClass=net.minecraft.data.Main -jar server.jar --all --output /tmp/vanilla/datagen 2>&1 | tail -20

      - name: Patch height-related files and write into nedra-mod
        run: |
          set -e
          NEW_MIN_Y=-352
          NEW_HEIGHT=672
          python3 - "$NEW_MIN_Y" "$NEW_HEIGHT" <<'PYEOF'
          import json, sys, os

          new_min_y = int(sys.argv[1])
          new_height = int(sys.argv[2])

          SRC = "/tmp/vanilla/datagen/data/minecraft"
          DST = "nedra-mod/src/main/resources/data/minecraft"

          def load(path):
              with open(path) as f:
                  return json.load(f)

          def save(path, data):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write("\n")

          def patch_y_clamped_gradients(node, old_from_y, new_from_y):
              # Recursively find every y_clamped_gradient node whose from_y matches
              # old_from_y (the vanilla bound) and rewrite it to new_from_y, leaving
              # to_y/from_value/to_value untouched so the slope just stretches over
              # the wider range. Returns the number of nodes patched.
              count = 0
              if isinstance(node, dict):
                  if node.get("type") == "minecraft:y_clamped_gradient" and node.get("from_y") == old_from_y:
                      node["from_y"] = new_from_y
                      count += 1
                  for v in node.values():
                      count += patch_y_clamped_gradients(v, old_from_y, new_from_y)
              elif isinstance(node, list):
                  for v in node:
                      count += patch_y_clamped_gradients(v, old_from_y, new_from_y)
              return count

          # 1. dimension_type/overworld.json
          d = load(f"{SRC}/dimension_type/overworld.json")
          d["min_y"] = new_min_y
          d["height"] = new_height
          d["logical_height"] = new_height
          save(f"{DST}/dimension_type/overworld.json", d)

          # 2. dimension_type/overworld_caves.json
          d = load(f"{SRC}/dimension_type/overworld_caves.json")
          d["min_y"] = new_min_y
          d["height"] = new_height
          d["logical_height"] = new_height
          save(f"{DST}/dimension_type/overworld_caves.json", d)

          # 3. worldgen/noise_settings/overworld.json
          d = load(f"{SRC}/worldgen/noise_settings/overworld.json")
          d["noise"]["min_y"] = new_min_y
          d["noise"]["height"] = new_height
          save(f"{DST}/worldgen/noise_settings/overworld.json", d)

          # 4. density_function/overworld/depth.json - main terrain depth gradient
          d = load(f"{SRC}/worldgen/density_function/overworld/depth.json")
          n = patch_y_clamped_gradients(d, -64, new_min_y)
          assert n == 1, f"expected exactly 1 y_clamped_gradient patched in depth.json, got {n}"
          save(f"{DST}/worldgen/density_function/overworld/depth.json", d)

          # 5. density_function/overworld/caves/spaghetti_2d.json - cave thickness gradient
          d = load(f"{SRC}/worldgen/density_function/overworld/caves/spaghetti_2d.json")
          n = patch_y_clamped_gradients(d, -64, new_min_y)
          assert n == 1, f"expected exactly 1 y_clamped_gradient patched in spaghetti_2d.json, got {n}"
          save(f"{DST}/worldgen/density_function/overworld/caves/spaghetti_2d.json", d)

          print("Patched files written:")
          for p in [
              f"{DST}/dimension_type/overworld.json",
              f"{DST}/dimension_type/overworld_caves.json",
              f"{DST}/worldgen/noise_settings/overworld.json",
              f"{DST}/worldgen/density_function/overworld/depth.json",
              f"{DST}/worldgen/density_function/overworld/caves/spaghetti_2d.json",
          ]:
              print(" -", p)
          PYEOF

      - name: Verify patched JSON is valid and sane
        run: |
          set -e
          python3 -c "
          import json
          base = 'nedra-mod/src/main/resources/data/minecraft'
          dt = json.load(open(f'{base}/dimension_type/overworld.json'))
          assert dt['min_y'] == -352, dt['min_y']
          assert dt['height'] == 672, dt['height']
          assert dt['logical_height'] == 672, dt['logical_height']
          ns = json.load(open(f'{base}/worldgen/noise_settings/overworld.json'))
          assert ns['noise']['min_y'] == -352
          assert ns['noise']['height'] == 672
          def find_gradients(node, acc):
              if isinstance(node, dict):
                  if node.get('type') == 'minecraft:y_clamped_gradient':
                      acc.append(node)
                  for v in node.values():
                      find_gradients(v, acc)
              elif isinstance(node, list):
                  for v in node:
                      find_gradients(v, acc)
              return acc
          depth = json.load(open(f'{base}/worldgen/density_function/overworld/depth.json'))
          gs = find_gradients(depth, [])
          assert len(gs) == 1 and gs[0]['from_y'] == -352 and gs[0]['to_y'] == 320, gs
          spag = json.load(open(f'{base}/worldgen/density_function/overworld/caves/spaghetti_2d.json'))
          gs = find_gradients(spag, [])
          assert len(gs) == 1 and gs[0]['from_y'] == -352 and gs[0]['to_y'] == 320, gs
          print('All height override files patched and sane.')
          "

      - name: Commit generated override files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nedra-mod/src/main/resources/data/minecraft
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add dimension height override data (min_y -352, extend depth by 288 blocks) [skip-ci-marker]"
            git push
          fi
