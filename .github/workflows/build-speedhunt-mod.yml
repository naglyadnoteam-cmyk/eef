name: Build Speedhunt Mod

on:
  push:
    branches:
      - claude/minecraft-speedrunner-hunter-mod-q48dt3
    paths:
      - 'speedhunt-mod/**'
      - '.github/workflows/build-speedhunt-mod.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speedhunt-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: speedhunt-mod-jar
          path: speedhunt-mod/build/libs/*.jar
          if-no-files-found: error
