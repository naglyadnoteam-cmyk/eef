name: Probe Minecraft/Fabric versions

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download version lists
        run: |
          curl -sS https://meta.fabricmc.net/v2/versions/game -o game.json
          curl -sS https://meta.fabricmc.net/v2/versions/loader -o loader.json
          curl -sS https://meta.fabricmc.net/v2/versions/yarn -o yarn.json

      - name: Game versions matching 26.x or 1.2x
        run: jq -r '.[] | select(.version | test("^(26\\.|1\\.2)")) | "\(.version) stable=\(.stable)"' game.json | head -100

      - name: Latest 15 game versions overall
        run: jq -r '.[0:15][] | "\(.version) stable=\(.stable)"' game.json

      - name: Latest loader versions
        run: jq -r '.[0:5][] | "\(.version) stable=\(.stable)"' loader.json

      - name: Yarn mappings for candidate versions
        run: jq -r '[.[] | select(.gameVersion | test("^(26\\.|1\\.2)"))] | group_by(.gameVersion) | map(.[0]) | .[] | "\(.gameVersion) -> \(.version)"' yarn.json | head -60

      - name: Fabric API maven-metadata
        run: curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | tail -c 4000

      - name: Yarn mappings for 26.2 specifically
        run: jq -r '.[] | select(.gameVersion == "26.2") | "\(.gameVersion) -> \(.version)"' yarn.json | head -20

      - name: All distinct yarn gameVersion values starting with 26
        run: jq -r '[.[].gameVersion] | unique | .[] | select(startswith("26"))' yarn.json

      - name: Raw first 3 yarn entries (sanity check field names)
        run: jq -c '.[0:3]' yarn.json

      - name: Loader maven-metadata (confirm latest)
        run: curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml | grep -A2 latest

      - name: Fabric Loom gradle plugin versions (latest)
        run: curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml | tail -c 2000

      - name: Intermediary mappings for 26.2 (confirms MC 26.2 is buildable at all)
        run: curl -sS https://meta.fabricmc.net/v2/versions/intermediary | jq -r '.[] | select(.version=="26.2")'

      - name: Any yarn-like mapping artifact for 26.x on Fabric maven
        run: |
          echo "--- yarn group listing ---"
          curl -sS https://maven.fabricmc.net/net/fabricmc/yarn/maven-metadata.xml | grep -o '26\.[0-9.]*[^<]*' | sort -u || true
          echo "--- loom mappings-related search: check if loom supports officialMojangMappings for 26.2 by checking piston meta for that version ---"
          curl -sS "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json" -o /dev/null -w "piston-meta reachable: %{http_code}\n" || true

      - name: Fabric Loom gradle plugin versions on Gradle Plugin Portal
        run: curl -sS https://plugins.gradle.org/m2/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml | tail -c 2000

      - name: Minecraft version manifest has 26.2 entry?
        run: curl -sS "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json" | jq -r '.versions[] | select(.id=="26.2")'
