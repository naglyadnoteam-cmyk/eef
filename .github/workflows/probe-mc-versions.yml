name: Probe Minecraft/Fabric versions

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fabric game versions (stable, matching 26.* or 1.2*)
        run: |
          curl -sS https://meta.fabricmc.net/v2/versions/game | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for v in data:
              if v['version'].startswith('26.') or v['version'].startswith('1.2'):
                  print(v['version'], 'stable=', v['stable'])
          " | head -100

      - name: Latest 10 Fabric game versions overall
        run: curl -sS https://meta.fabricmc.net/v2/versions/game | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for v in data[:15]:
              print(v['version'], 'stable=', v['stable'])
          "

      - name: Latest Fabric loader versions
        run: curl -sS https://meta.fabricmc.net/v2/versions/loader | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for v in data[:5]:
              print(v['version'], 'stable=', v['stable'])
          "

      - name: Yarn mappings for candidate versions
        run: |
          curl -sS https://meta.fabricmc.net/v2/versions/yarn | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          seen = set()
          for v in data:
              gv = v['gameVersion']
              if (gv.startswith('26.') or gv.startswith('1.2')) and gv not in seen:
                  seen.add(gv)
                  print(gv, '->', v['version'])
          " | head -60

      - name: Fabric API maven-metadata (recent versions)
        run: curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | tail -c 4000
