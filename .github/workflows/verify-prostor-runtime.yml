name: Verify Prostor Runtime

on:
  push:
    branches:
      - claude/stoic-bell-nkwv8g
    paths:
      - 'prostor-mod/src/**'
      - 'prostor-mod/*.gradle'
      - 'prostor-mod/gradle.properties'
      - '.github/workflows/verify-prostor-runtime.yml'
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci-marker')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build mod
        working-directory: prostor-mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Set up a throwaway Fabric server
        run: |
          set -e
          mkdir -p /tmp/server/mods
          cd /tmp/server
          curl -sSL -o fabric-installer.jar https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.0.1/fabric-installer-1.0.1.jar
          java -jar fabric-installer.jar server -mcversion 1.21.11 -loader 0.19.5 -downloadMinecraft -dir /tmp/server
          curl -sSL -o mods/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.141.6+1.21.11/fabric-api-0.141.6+1.21.11.jar"
          # только запускаемый jar: в -sources.jar тоже есть fabric.mod.json, и мод загрузился бы дважды
          JAR=$(ls "$GITHUB_WORKSPACE"/prostor-mod/build/libs/prostor-*.jar | grep -v -- '-sources.jar' | head -1)
          cp "$JAR" mods/
          ls -la mods/
          echo "eula=true" > eula.txt
          # фиксированный сид, чтобы лог от запуска к запуску можно было сравнивать
          printf 'level-seed=prostor\nview-distance=8\n' > server.properties

      - name: Run server for 120 seconds
        working-directory: /tmp/server
        run: |
          set +e
          # после загрузки мира сервер сам ищет каждый биом мода и печатает результат
          ( sleep 75; echo "prostor locate_all"; sleep 30; echo "stop" ) | timeout 120 java -Xmx3G -jar fabric-server-launch.jar nogui > console.log 2>&1
          echo "server ended with exit code $?"

      - name: Print server log
        if: always()
        run: |
          echo "===== full console.log ====="
          cat /tmp/server/console.log || echo "no log found"
          echo "===== error / exception lines ====="
          grep -iE "error|exception|failed|could not|invalid" /tmp/server/console.log || echo "no error lines found"
          echo "===== startup check ====="
          grep -E "Done \(" /tmp/server/console.log || { echo "SERVER DID NOT FINISH STARTING"; exit 1; }
          if grep -qE "Exception|Crash|FATAL" /tmp/server/console.log; then echo "EXCEPTIONS IN LOG"; exit 1; fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prostor-server-log
          path: /tmp/server/console.log
          if-no-files-found: warn
