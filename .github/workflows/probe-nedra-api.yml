name: Probe Nedra API

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nedra-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache decompiled sources
        uses: actions/cache@v4
        with:
          path: nedra-mod/.gradle/loom-cache
          key: nedra-decompile-1.21.11-build6-v1

      - name: Gen sources
        run: ./gradlew genSources --no-daemon --stacktrace

      - name: Probe several APIs
        run: |
          set +e
          echo "===== listing all sources jars under loom-cache ====="
          find .gradle/loom-cache -iname "*-sources.jar" 2>/dev/null
          SRC=$(realpath "$(find .gradle/loom-cache/minecraftMaven -ipath "*minecraft-common-*" -iname "*-sources.jar" | head -1)")
          echo "SRC=$SRC"
          mkdir -p /tmp/src
          cd /tmp/src
          echo "===== find any Armor*.java / Equip*.java files in the jar ====="
          unzip -l "$SRC" | grep -iE "/Armor[A-Za-z]*\.java|/Equip[A-Za-z]*\.java|EquippableComponent"

          unzip -oq "$SRC" "net/minecraft/item/Items.java"

          echo "===== Items.java: IRON_HELMET registration line exactly ====="
          grep -n "IRON_HELMET" net/minecraft/item/Items.java

          echo "===== Items.java: NETHERITE_HELMET registration line exactly ====="
          grep -n "NETHERITE_HELMET" net/minecraft/item/Items.java

          echo "===== Items.java: static register helper signature(s) ====="
          grep -n "private static Item register\|static Item register(" net/minecraft/item/Items.java | head -10

          ARMORFILE=$(unzip -l "$SRC" | grep -iE "/Armor[A-Za-z]*\.java" | awk '{print $NF}' | grep -i "ArmorItem\|ArmorMaterial" | head -1)
          echo "ARMORFILE=$ARMORFILE"
          if [ -n "$ARMORFILE" ]; then
            unzip -oq "$SRC" "$ARMORFILE"
            echo "===== $ARMORFILE head ====="
            sed -n '1,70p' "$ARMORFILE"
          fi

          EQUIPFILE=$(unzip -l "$SRC" | grep -iE "EquippableComponent.java" | awk '{print $NF}' | head -1)
          echo "EQUIPFILE=$EQUIPFILE"
          if [ -n "$EQUIPFILE" ]; then
            unzip -oq "$SRC" "$EQUIPFILE"
            echo "===== $EQUIPFILE head ====="
            sed -n '1,70p' "$EQUIPFILE"
          fi

          echo "===== Feature.java: class decl + generate signature + a few static field registrations ====="
          unzip -oq "$SRC" "net/minecraft/world/gen/feature/Feature.java"
          grep -n "^public abstract class Feature\|public abstract boolean generate\|public Feature(\|static final Feature<" net/minecraft/world/gen/feature/Feature.java | head -20
          echo "----- Feature.java full head (first 60 lines) -----"
          sed -n '1,60p' net/minecraft/world/gen/feature/Feature.java

          echo "===== FeatureContext.java full content ====="
          unzip -oq "$SRC" "net/minecraft/world/gen/feature/util/FeatureContext.java"
          cat net/minecraft/world/gen/feature/util/FeatureContext.java

          echo "===== DefaultFeatureConfig.java full content ====="
          unzip -oq "$SRC" "net/minecraft/world/gen/feature/DefaultFeatureConfig.java"
          cat net/minecraft/world/gen/feature/DefaultFeatureConfig.java

          echo "===== a simple real Feature subclass for reference: LakeFeature.java or DiskFeature.java ====="
          LAKEFILE=$(unzip -l "$SRC" | grep -iE "/LakeFeature\.java|/DiskFeature\.java" | awk '{print $NF}' | head -1)
          echo "LAKEFILE=$LAKEFILE"
          if [ -n "$LAKEFILE" ]; then
            unzip -oq "$SRC" "$LAKEFILE"
            cat "$LAKEFILE"
          fi

          echo "===== FeatureConfig.java (marker interface) ====="
          unzip -oq "$SRC" "net/minecraft/world/gen/feature/FeatureConfig.java" 2>/dev/null
          cat net/minecraft/world/gen/feature/FeatureConfig.java 2>/dev/null || echo "not found directly"

          echo "===== StructureWorldAccess / FeatureContext usage - getWorld/getRandom/getOrigin/getConfig methods ====="
          grep -n "public " net/minecraft/world/gen/feature/util/FeatureContext.java

          echo "DONE"
